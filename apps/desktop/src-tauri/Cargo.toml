[package]
name = "windgets"
version = "0.1.0"
description = "Windgets: wallpaper y planificador de escritorio para Windows"
authors = ["ForkTech"]
edition = "2024"
rust-version = "1.91"
publish = false

[lib]
name = "windgets_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = [] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
ts-rs = { version = "=12.0.1", features = ["no-serde-warnings"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
