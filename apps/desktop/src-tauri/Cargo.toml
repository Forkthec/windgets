[package]
name = "windgets"
version = "0.1.0"
description = "Windgets: wallpaper y planificador de escritorio para Windows"
authors = ["ForkTech"]
edition = "2024"
rust-version = "1.91"
publish = false

[lib]
name = "windgets_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = [] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
ts-rs = { version = "=12.0.1", features = ["no-serde-warnings"] }
# Cliente HTTPS del Núcleo hacia Supabase (INT-01, arquitectura.md: «Rust, reqwest»). La misma versión que
# ya trae Tauri; TLS del sistema (Schannel en Windows) con mínimo TLS 1.2 (RNF-18).
reqwest = { version = "=0.13.5", default-features = false, features = ["json", "native-tls"] }

# API de Windows para el Host del wallpaper (INT-07, contratos.md): la misma versión que ya trae Tauri.
[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_Security_Cryptography",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_System_Threading",
  "Win32_UI_Controls",
  "Win32_UI_HiDpi",
  "Win32_UI_Input",
  "Win32_UI_WindowsAndMessaging",
] }

[features]
# Prototipo del spike P01 (WorkerW y Raw Input, D-131 y D-186). Solo lo compila el flujo spike.yml.
spike = []

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# Estilo de convenciones.md: sin unwrap() ni expect() fuera de pruebas (clippy.toml los permite en pruebas)
# y sin unsafe salvo en el módulo de integración con Win32, que lo permitirá con un comentario por bloque.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
undocumented_unsafe_blocks = "deny"
