name: release

# Al crear una etiqueta v*: despliega las Edge Functions (job `funciones`, con la aprobación del environment
# `produccion`) y después compila, genera el instalador NSIS y lo publica como Windgets-Setup.exe (nombre fijo,
# D-194; la landing lo descarga, INT-12). El instalador espera a las funciones: no sale una app nueva que hable con
# una función vieja. `workflow_dispatch` redespliega solo las funciones, a mano, desde Actions.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  funciones:
    runs-on: ubuntu-24.04
    environment: produccion
    permissions:
      contents: read
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: supabase/setup-cli@v3.2.0
        with:
          version: 3.2.0
      # Sin nombre despliega todas las funciones de supabase/functions/ (las carpetas que empiezan por `_` son
      # código compartido) con el `verify_jwt = true` de supabase/config.toml (D-192). `--yes` porque el CLI pide
      # confirmación y en Actions no hay terminal: sin él no despliega nada y el job falla.
      - name: Desplegar las Edge Functions
        run: supabase functions deploy --yes --project-ref "$SUPABASE_PROJECT_ID"
      - name: Dejar en el log las versiones desplegadas
        run: supabase functions list --project-ref "$SUPABASE_PROJECT_ID"

  release:
    needs: funciones
    if: github.event_name == 'push'
    runs-on: windows-2025
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Rust (versión de rust-toolchain.toml)
        run: rustup show
      - name: Generar el instalador
        env:
          WINDGETS_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          WINDGETS_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: pnpm --filter desktop tauri build --bundles nsis
      - name: Renombrar a Windgets-Setup.exe y sellarlo (CD-02-HU01-CA12)
        shell: bash
        run: |
          cp apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe Windgets-Setup.exe
          node installer/sellar.mjs Windgets-Setup.exe
      - name: Publicar la release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" Windgets-Setup.exe --title "${{ github.ref_name }}" --generate-notes
